name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git php
          apk add --no-cache php-json 2>/dev/null || true

      - name: Get latest code
        uses: actions/checkout@v7

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate PHP syntax and smoke tests
        run: |
          for f in *.php tools/*.php tests/*.php; do
            [ -f "$f" ] && php -l "$f"
          done
          php tests/smoke.php

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Assumes FTP account is rooted to the site directory.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            *.md
            **/*.md
            data/*.json
            data/*.lock
            data/*.log
            data/*.tmp.*
            files/**
            gallery/**
            images/**
            e2e2rc_LOGO.png
            tools/**
            tests/**
            redesign/**
            **/.agents/**
            skills-lock.json
